# Local development deployment settings.
#
# Both runtime blocks live here. The right one is selected at runtime
# based on what is installed on the host (apptainer wins if both are
# present). See diann_runner.container_utils.detect_runtime().
#
# To pin the runtime instead of auto-detecting (e.g. a host that has apptainer
# installed but no SIF cache), uncomment:
# container_runtime: docker   # or: apptainer

app_runner: "fgcz_app_runner"

images:
  docker:
    diann_images:
      "2.3.2": "diann:2.3.2"
      "2.5.0": "diann:2.5.0"
      "2.5.1": "diann:2.5.1"
      "2.6.0": "diann:2.6.0"
      "2.6.1": "diann:2.6.1"
    diann_docker_image: "diann:2.3.2"
    thermoraw_image: "thermorawfileparser:2.0.0"
    msconvert_docker: "chambm/pwiz-skyline-i-agree-to-the-vendor-licenses"
    # 2.2.7+ reads native DIA-NN 2.x output (parquet / Run column) directly.
    prolfquapp_image: "ghcr.io/prolfqua/prolfquapp:2.9.0"

  apptainer:
    # Installed SIF paths, per the FGCZ apptainer standard:
    # /misc/container/exp/<app>/<app>-<version>.sif. Kept identical to
    # defaults_server.yml so a local apptainer run on an FGCZ host resolves
    # the same images. Override with --config for a scratch build.
    diann_images:
      "2.3.2": "/misc/container/exp/diann/diann-2.3.2.sif"
      "2.5.0": "/misc/container/exp/diann/diann-2.5.0.sif"
      "2.5.1": "/misc/container/exp/diann/diann-2.5.1.sif"
      "2.6.0": "/misc/container/exp/diann/diann-2.6.0.sif"
      "2.6.1": "/misc/container/exp/diann/diann-2.6.1.sif"
    diann_docker_image: "/misc/container/exp/diann/diann-2.3.2.sif"
    thermoraw_image: "/misc/container/exp/thermorawfileparser/thermorawfileparser-2.0.0.sif"
    # pwiz publishes no usable version tag, so the filename records the capture date.
    msconvert_docker: "/misc/container/exp/pwiz/pwiz-2026-08-26.sif"
    prolfquapp_image: "/misc/container/exp/prolfquapp/prolfquapp-2.9.0.sif"
