# Production server deployment settings.
#
# Both runtime blocks live here. The right one is selected at runtime
# based on what is installed on the host (apptainer wins if both are
# present). See diann_runner.container_utils.detect_runtime().
#
# To pin the runtime instead of auto-detecting (e.g. a host that has apptainer
# installed but no SIF cache), uncomment:
# container_runtime: docker   # or: apptainer

app_runner: "fgcz_app_runner"

images:
  docker:
    # DIA-NN images keyed by pipeline_diann_version dropdown value.
    diann_images:
      "2.3.2": "diann:2.3.2"
      "2.5.0": "diann:2.5.0"
      "2.5.1": "diann:2.5.1"
      "2.6.0": "diann:2.6.0"
      "2.6.1": "diann:2.6.1"
    # Legacy fallback for old params.yml without pipeline_diann_version.
    diann_docker_image: "diann:2.3.2"
    # File conversion images.
    thermoraw_image: "thermorawfileparser:2.0.0"
    msconvert_docker: "chambm/pwiz-skyline-i-agree-to-the-vendor-licenses"
    # QC. X.Y.Z+ reads native DIA-NN 2.x output (parquet / Run column) directly,
    # so the runner no longer renames Run->File.Name into a prolfqua-format TSV.
    prolfquapp_image: "ghcr.io/prolfqua/prolfquapp:2.9.0"

  apptainer:
    # Installed SIF paths, per the FGCZ apptainer standard:
    # /misc/container/exp/<app>/<app>-<version>.sif (slurmworker
    # docs/apptainer-build.md). The version in the filename is the
    # reproducibility anchor — bump the path, never overwrite a SIF in place.
    #
    # deploy.smk does NOT write here: /misc/container/exp is a shared,
    # privileged export. It builds into deploy.sif_staging_dir; installing is
    # the separate, deliberate scripts/install_sif.sh step.
    diann_images:
      "2.3.2": "/misc/container/exp/diann/diann-2.3.2.sif"
      "2.5.0": "/misc/container/exp/diann/diann-2.5.0.sif"
      "2.5.1": "/misc/container/exp/diann/diann-2.5.1.sif"
      "2.6.0": "/misc/container/exp/diann/diann-2.6.0.sif"
      "2.6.1": "/misc/container/exp/diann/diann-2.6.1.sif"
    diann_docker_image: "/misc/container/exp/diann/diann-2.3.2.sif"
    thermoraw_image: "/misc/container/exp/thermorawfileparser/thermorawfileparser-2.0.0.sif"
    # pwiz publishes no usable version tag, so the filename records the date
    # the image was captured (deploy.msconvert_capture_date) instead.
    msconvert_docker: "/misc/container/exp/pwiz/pwiz-2026-08-26.sif"
    prolfquapp_image: "/misc/container/exp/prolfquapp/prolfquapp-2.9.0.sif"

# Build-time settings for deploy.smk (building/pulling the images above).
# Kept here, next to the image definitions, so there is a single config
# source and no separate deploy file to drift. Image *versions* are not
# repeated — deploy.smk derives them from the images block above. Override
# any of these for a one-off build with `--config key=value`.
deploy:
  # Where deploy.smk builds/pulls SIFs. Staging only — node-local scratch, not
  # the shared export the runtime reads from. ${USER} is expanded.
  sif_staging_dir: "/scratch/${USER}/sif"
  # Install target for scripts/install_sif.sh. The SIF must be copied to the
  # NFS server's export path, which compute nodes see as /misc/container/exp.
  sif_install_host: fgcz-h-492
  sif_install_root: /export/nfs4/container/exp
  # pwiz is pulled untagged, so its SIF filename carries the capture date
  # instead of a version. Bump this when re-pulling msconvert, and update
  # images.apptainer.msconvert_docker to match.
  msconvert_capture_date: "2026-08-26"
  # SIF builder: "native" (apptainer build from .def, no docker) or "docker"
  # (convert local docker images via docker-daemon://).
  sif_builder: native
  # Rebuild/repull images even when they already exist.
  force_rebuild: false
